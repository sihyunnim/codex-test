<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>4블록 자리 배치기</title>
    <style>
      :root {
        font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
        color: #1f2937;
        background: #f8fafc;
      }

      body {
        margin: 0;
        padding: 24px;
      }

      .panel {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
      }

      button {
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 15px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      .hint {
        font-size: 14px;
        color: #475569;
      }

      .preview {
        margin-top: 16px;
        font-size: 14px;
      }

      ol {
        margin: 8px 0 0;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>사람 자리 배치 프로그램</h1>
      <p>
        버튼을 누르면 <strong>1단계(랜덤 섞기)</strong>와
        <strong>2단계(4블록 자리 배치도)</strong>를 별도 창으로 표시합니다.
      </p>
      <button id="generateBtn" type="button">배치 생성하기</button>
      <p class="hint">팝업이 차단되면 같은 페이지 아래 미리보기도 함께 보여줍니다.</p>
      <section class="preview" id="preview"></section>
    </main>

    <script>
      const people = [
        "김시현",
        "박선영",
        "육나영",
        "정애리",
        "김충환",
        "변선희",
        "이경민",
        "유혜진",
        "공승환",
        "곽기은",
        "배병준",
        "서현지",
        "신해빈",
        "이건형",
        "하승아",
        "김희준",
      ];

      const BLOCK_COUNT = 4;
      const SEATS_PER_BLOCK = 4;
      const GRID_ROWS = 2;
      const GRID_COLS = 3;

      function shuffle(array) {
        const result = [...array];
        for (let i = result.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [result[i], result[j]] = [result[j], result[i]];
        }
        return result;
      }

      function buildBlocks(shuffled) {
        const blocks = [];
        for (let blockIndex = 0; blockIndex < BLOCK_COUNT; blockIndex += 1) {
          const start = blockIndex * SEATS_PER_BLOCK;
          const assigned = shuffled.slice(start, start + SEATS_PER_BLOCK);

          const cells = Array.from({ length: GRID_ROWS * GRID_COLS }, (_, index) => {
            if (index < assigned.length) {
              return assigned[index];
            }
            return "빈자리";
          });

          blocks.push({
            name: `${blockIndex + 1}블록`,
            cells,
          });
        }

        return blocks;
      }

      function buildStep1Html(shuffled) {
        return `
          <h2>1단계: 랜덤 섞인 순서</h2>
          <ol>${shuffled.map((name) => `<li>${name}</li>`).join("")}</ol>
        `;
      }

      function blockToTable(block) {
        const rows = [];
        for (let row = 0; row < GRID_ROWS; row += 1) {
          const cols = [];
          for (let col = 0; col < GRID_COLS; col += 1) {
            const value = block.cells[row * GRID_COLS + col];
            cols.push(`<td>${value}</td>`);
          }
          rows.push(`<tr>${cols.join("")}</tr>`);
        }

        return `
          <article style="margin-bottom: 16px;">
            <h3 style="margin: 0 0 8px;">${block.name}</h3>
            <table border="1" cellspacing="0" cellpadding="8" style="border-collapse: collapse; text-align: center; min-width: 330px;">
              ${rows.join("")}
            </table>
            <p style="margin: 6px 0 0; color: #334155; font-size: 13px;">※ 블록당 4명 배치, 나머지 2칸은 빈자리</p>
          </article>
        `;
      }

      function buildStep2Html(blocks) {
        return `
          <h2>2단계: 전체 자리 배치도 (4블록)</h2>
          ${blocks.map(blockToTable).join("")}
        `;
      }

      function openWindow(title, innerHtml) {
        const popup = window.open("", "_blank", "width=700,height=750");
        if (!popup) {
          return false;
        }

        popup.document.write(`
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="UTF-8" />
              <title>${title}</title>
            </head>
            <body style="font-family: 'Noto Sans KR', system-ui, sans-serif; padding: 20px; line-height: 1.6;">
              ${innerHtml}
            </body>
          </html>
        `);
        popup.document.close();
        return true;
      }

      function renderPreview(step1Html, step2Html) {
        const preview = document.querySelector("#preview");
        preview.innerHTML = `
          <h2>페이지 내 미리보기</h2>
          ${step1Html}
          <hr />
          ${step2Html}
        `;
      }

      document.querySelector("#generateBtn").addEventListener("click", () => {
        const shuffled = shuffle(people);
        const blocks = buildBlocks(shuffled);

        const step1Html = buildStep1Html(shuffled);
        const step2Html = buildStep2Html(blocks);

        const openedStep1 = openWindow("1단계 - 랜덤 순서", step1Html);
        const openedStep2 = openWindow("2단계 - 자리 배치도", step2Html);

        if (!openedStep1 || !openedStep2) {
          alert("팝업이 차단되어 페이지 내 미리보기를 표시합니다.");
        }

        renderPreview(step1Html, step2Html);
      });
    </script>
  </body>
</html>
